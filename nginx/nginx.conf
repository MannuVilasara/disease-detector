server {
    listen 443 ssl http2;
    server_name fit-ai.ikeshav.tech;

    ssl_certificate /etc/letsencrypt/live/fit-ai.ikeshav.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit-ai.ikeshav.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;



    location /api {
        proxy_pass http://139.59.26.162:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    
    location / {
        proxy_pass http://139.59.26.162:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}