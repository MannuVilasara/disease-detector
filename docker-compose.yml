version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    image: disease-detector-backend:latest
    container_name: disease-detector-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    image: disease-detector-frontend:latest
    container_name: disease-detector-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://disease-detector-backend:8000
    depends_on:
      - backend
    restart: unless-stopped

